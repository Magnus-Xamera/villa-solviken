<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Villa Solviken</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f4; --card:#fff; --ink:#0f2230; --muted:#62768a; --line:#e3e9ee;
  --green:#12936f; --green-d:#0b3d4f; --green-l:#e4f3f0;
  --clay:#ff7a59; --clay-l:#ffe9e2;
  --amber:#f0a928; --amber-l:#fdf0d2;
  --blue:#3b82c4; --blue-l:#e6f0fa;
  --red:#d2453b; --red-l:#fbe6e3;
  --sand:#e8eef2; --sky:#cfe3ec;
  --r:20px; --fh:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 1px 2px rgba(15,34,48,.06),0 10px 24px -8px rgba(15,34,48,.14),0 28px 48px -28px rgba(15,34,48,.22);
  --shadow-s:0 1px 0 rgba(255,255,255,.8) inset,0 1px 2px rgba(15,34,48,.08),0 4px 10px -3px rgba(15,34,48,.14);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:15.5px/1.5 var(--fh);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 600px at 85% -10%,#dcebf1 0,transparent 60%),radial-gradient(900px 500px at -10% 20%,#f3ece4 0,transparent 55%),var(--bg);background-attachment:fixed}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-family:var(--fh);font-weight:800;letter-spacing:-.025em}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em;flex:0 0 auto}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
/* hero */
.hero{position:relative;height:250px;overflow:hidden;color:#fff;border-radius:0 0 34px 34px;box-shadow:0 20px 40px -24px rgba(11,61,79,.55);isolation:isolate}
.hero .scene,.hero .scene svg,.hero .photo{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero .photo{object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(6,28,40,.55) 0%,rgba(6,28,40,.12) 42%,rgba(6,28,40,.5) 100%)}
.hero .wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding-top:16px;padding-bottom:50px}
.hero .top{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand .logo{filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.brand h1{font-family:var(--fh);font-size:clamp(30px,8vw,46px);font-weight:800;color:#fff;letter-spacing:-.035em;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.brand small{display:block;color:rgba(255,255,255,.85);font-weight:600;font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-top:4px}
.pill{font-size:12px;font-weight:700;padding:7px 13px;border-radius:99px;background:rgba(255,255,255,.18);color:#fff;white-space:nowrap;border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.pill.warn{background:rgba(253,240,210,.92);color:#7a5200;border-color:transparent}
/* nav */
nav.tabs{position:sticky;top:10px;z-index:20;margin:-30px 0 0;padding:0 12px;pointer-events:none}
nav.tabs .in{display:flex;gap:2px;max-width:1100px;margin:0 auto;padding:6px;overflow-x:auto;scrollbar-width:none;pointer-events:auto;
  background:rgba(255,255,255,.78);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 1px 0 #fff inset,0 12px 30px -10px rgba(15,34,48,.3)}
nav.tabs .in::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--muted);padding:10px 15px;border-radius:16px;font-weight:700;font-size:14px;transition:background .15s,color .15s}
nav.tabs button:hover{background:rgba(15,34,48,.05);color:var(--ink)}
nav.tabs button.on{background:linear-gradient(180deg,#14566d,#0b3d4f);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 6px 14px -4px rgba(11,61,79,.6)}
main{padding:34px 0 100px}
.sub{color:var(--muted);margin:4px 0 16px}
.card{background:linear-gradient(180deg,#fff,#fbfcfd);border:1px solid rgba(255,255,255,.9);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.roomcard{transition:transform .2s,box-shadow .2s}
.roomcard:hover{transform:translateY(-3px)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat .lbl{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.stat.hero2{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 0% 0%,#1e7f95 0,transparent 55%),linear-gradient(145deg,#0f5268,#082f3d);color:#fff;border:0;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 18px 32px -14px rgba(8,47,61,.7)}
.stat.hero2::after{content:"";position:absolute;right:-30px;top:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.stat.hero2 .lbl,.stat.hero2 .note{color:#c4dfe6}
.stat.hero2 .good{color:#8ff0cc}.stat.hero2 .bad{color:#ffc1b8}
.stat .val{font-family:var(--fh);font-size:clamp(21px,5.5vw,30px);font-weight:800;letter-spacing:-.03em;margin:3px 0}
.stat .note{font-size:13px;color:var(--muted)}
.good{color:var(--green)} .bad{color:var(--red)}
.bar{height:11px;background:#e3eaef;border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(15,34,48,.18)}
.bar>i{display:block;height:100%;background:linear-gradient(180deg,#2cc298,#0e8a68);border-radius:99px;box-shadow:0 1px 0 rgba(255,255,255,.5) inset}
.bar.over>i{background:linear-gradient(180deg,#f0736a,#c53a30)}
.bar.done>i{background:linear-gradient(180deg,#2cc298,#0e8a68)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 22px;font-weight:700;color:#fff;background:linear-gradient(180deg,#14566d,#0b3d4f);box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 8px 16px -6px rgba(11,61,79,.55);transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 2px 6px -2px rgba(11,61,79,.5)}
.btn.ghost{background:linear-gradient(180deg,#fff,#eef3f6);color:var(--green-d);box-shadow:0 1px 0 #fff inset,0 0 0 1px rgba(15,34,48,.08),0 3px 8px -3px rgba(15,34,48,.18)}
.btn.danger{background:var(--red-l);color:var(--red);box-shadow:0 0 0 1px rgba(210,69,59,.2)}
.btn.small{padding:8px 14px;font-size:14px;border-radius:12px}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.wrapx{flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:0;background:#fff;border-radius:99px;padding:8px 15px;font-weight:700;font-size:14px;color:var(--muted);box-shadow:var(--shadow-s)}
.chip.on{background:linear-gradient(180deg,#14566d,#0b3d4f);color:#fff}
.roomhead{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(180deg,#f3f8fa,#e9f1f5);cursor:pointer}
.roomhead .nm{font-weight:800;flex:1;letter-spacing:-.01em}
.roomhead .tot{font-size:14px;color:var(--green-d);font-weight:700;text-align:right}
.ico{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:11px;color:#fff;background:linear-gradient(145deg,#2a8aa3,#0b3d4f);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 5px 10px -3px rgba(11,61,79,.5);flex:0 0 auto}
.section{margin-bottom:16px;background:#fff;border:1px solid rgba(255,255,255,.9);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.item:hover{background:#f6f9fb}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:700}
.item.isdone .t b{text-decoration:line-through;color:var(--muted)}
.item .meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:3px;align-items:center}
.item .meta span{display:inline-flex;align-items:center;gap:4px}
.item .amt{text-align:right;white-space:nowrap;font-weight:800}
.item .amt small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.chk{width:30px;height:30px;border-radius:10px;border:0;background:linear-gradient(180deg,#fff,#eef2f5);color:#fff;line-height:1;flex:0 0 auto;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px #c5d0d8,0 1px 2px rgba(15,34,48,.1)}
.chk.on{background:linear-gradient(180deg,#2cc298,#0e8a68);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 6px 12px -4px rgba(14,138,104,.7)}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--blue-l);color:var(--blue);font-weight:700}
.tag.warn{background:var(--red-l);color:var(--red)}
.add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-top:1px dashed #cfd9e0;background:#fff;padding:13px;color:var(--green);font-weight:800}
.add:hover{background:var(--green-l)}
.empty{text-align:center;padding:34px 16px}
.empty h2{margin-bottom:6px}
.steps{display:grid;gap:12px;margin:14px 0}
.steps .s{display:flex;gap:12px;align-items:flex-start}
.steps .n{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#ff9a7e,#ff6a45);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 6px 12px -4px rgba(255,106,69,.7)}
.roomcard h3{display:flex;gap:10px;align-items:center;font-size:17px;font-weight:800;letter-spacing:-.01em}
.roomcard .kv{margin-top:14px}
.roomcard .kv .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.roomcard .kv .top span:first-child{font-weight:700}
.roomcard .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.herophoto{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.herophoto input[type=file]{display:none}
/* modal */
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:90;max-width:90vw;padding:12px 18px;border-radius:16px;background:rgba(11,61,79,.94);backdrop-filter:blur(10px);color:#fff;font-weight:700;box-shadow:0 14px 34px -8px rgba(0,0,0,.45);display:none;text-align:center}
#toast.err{background:rgba(210,69,59,.96)}
#modal{position:fixed;inset:0;height:100dvh;background:rgba(8,26,36,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.open{display:flex}
.sheet{background:linear-gradient(180deg,#fff,#fafcfd);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:28px 28px 0 0;padding:22px 18px 0;box-shadow:0 -20px 60px -10px rgba(8,26,36,.4)}
@media(min-width:640px){#modal{align-items:center}.sheet{border-radius:26px;box-shadow:0 40px 80px -20px rgba(8,26,36,.55)}}
.sheet h2{margin-bottom:14px}
.f{margin-bottom:14px}
.f label{display:block;font-weight:700;margin-bottom:6px;font-size:14.5px}
.f .hint{font-size:13px;color:var(--muted);margin-top:4px}
.f input[type=text],.f input[type=number],.f input[type=date],.f input[type=password],.f select,.f textarea{width:100%;padding:12px 13px;border:0;border-radius:13px;font:inherit;background:#f1f5f8;color:var(--ink);box-shadow:inset 0 1px 3px rgba(15,34,48,.14),0 0 0 1px rgba(15,34,48,.06)}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;background:#fff;box-shadow:0 0 0 3px rgba(18,147,111,.28),0 0 0 1px var(--green)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts label{margin:0;font-weight:700}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:inline-block;background:#f1f5f8;border-radius:99px;padding:9px 15px;font-size:14px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(15,34,48,.08)}
.opts input:checked+span{background:linear-gradient(180deg,#14566d,#0b3d4f);color:#fff;box-shadow:0 6px 12px -4px rgba(11,61,79,.6)}
.calc{background:var(--green-l);border-radius:13px;padding:11px 13px;font-weight:800;color:var(--green-d)}
.donecheck{display:flex;gap:10px;align-items:center;font-weight:700;padding:12px;background:var(--green-l);border-radius:13px}
.donecheck input{width:22px;height:22px}
.sheet .btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;position:sticky;bottom:0;background:linear-gradient(180deg,rgba(250,252,253,.85),#fafcfd 30%);padding:14px 0 18px;border-top:1px solid var(--line)}
.sheet .btns .btn{flex:1}
/* kalender */
.cal{border-radius:16px;padding:12px;background:#f6f9fb;box-shadow:inset 0 0 0 1px rgba(15,34,48,.08)}
.cal .ch{display:flex;align-items:center;justify-content:space-between;font-weight:800;text-transform:capitalize}
.cal .ch button{border:0;background:#fff;color:var(--green-d);width:38px;height:38px;border-radius:12px;font-size:20px;line-height:1;box-shadow:var(--shadow-s)}
.cal .g7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px}
.cd{border:0;background:transparent;aspect-ratio:1;min-height:36px;border-radius:11px;font:inherit;font-weight:700;color:var(--ink);padding:0}
.cd:hover{background:#fff;box-shadow:var(--shadow-s)}
.cd.today{box-shadow:inset 0 0 0 2px var(--clay)}
.cd.mid{background:#d6ece6;border-radius:5px}
.cd.st,.cd.en{background:linear-gradient(180deg,#14566d,#0b3d4f);color:#fff;box-shadow:0 6px 12px -4px rgba(11,61,79,.6)}
.cal .sum{margin-top:10px;font-weight:800;color:var(--green-d);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cal .sum .hint{font-weight:500}
/* gantt */
.gwrap{overflow-x:auto;background:#fff;border:1px solid rgba(255,255,255,.9);border-radius:var(--r);box-shadow:var(--shadow)}
.g-row{display:flex;border-top:1px solid var(--line);min-height:42px}
.g-lab{flex:0 0 170px;position:sticky;left:0;background:#fff;z-index:2;padding:10px 12px;font-size:14px;border-right:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-lab.room{background:#eaf2f6;font-weight:800;color:var(--green-d)}
.g-track{position:relative;flex:0 0 auto;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(var(--w) - 1px),#eef2f5 calc(var(--w) - 1px),#eef2f5 var(--w))}
.g-track.room{background-color:#eaf2f6}
.g-head .g-lab{font-weight:800}
.g-m{position:absolute;top:0;height:30px;border-left:1px solid var(--line);padding:7px 6px;font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:clip}
.g-w{position:absolute;top:30px;bottom:0;text-align:center;font-size:11px;color:var(--muted);padding-top:6px}
.g-bar{position:absolute;top:8px;height:26px;border-radius:9px;color:#fff;font-size:12px;font-weight:700;padding:4px 9px;overflow:hidden;white-space:nowrap;cursor:pointer;min-width:16px;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 5px 10px -3px rgba(15,34,48,.4)}
.g-bar.todo{background:linear-gradient(180deg,#5aa0dc,#2f72b3)} .g-bar.doing{background:linear-gradient(180deg,#f7c158,#e39a10);color:#4a3200} .g-bar.late{background:linear-gradient(180deg,#f0736a,#c53a30)} .g-bar.ok{background:linear-gradient(180deg,#2cc298,#0e8a68)}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--clay);z-index:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:12px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}
/* tables */
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
tfoot td{font-weight:800;border-top:2px solid var(--ink)}
.scrollx{overflow-x:auto}
.legendlist{display:grid;gap:6px;font-size:14px}
.legendlist div{display:flex;align-items:center;gap:8px}
.legendlist i{width:12px;height:12px;border-radius:4px;flex:0 0 auto}
.legendlist b{margin-left:auto;padding-left:10px}
.hbar{display:grid;grid-template-columns:120px 1fr 100px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.hbar .bar{height:14px}
.rep h2{margin:24px 0 12px;font-size:20px}
.rep ul{margin:6px 0 0;padding-left:20px}
.login{max-width:380px;margin:70px auto;text-align:center}
.fab{position:fixed;right:16px;bottom:16px;z-index:15;border-radius:18px;padding:15px 24px;background:linear-gradient(180deg,#ff8f70,#f2603a);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 16px 30px -8px rgba(242,96,58,.7)}
.fab:hover{filter:brightness(1.06)}
@media print{
  .hero,nav.tabs,.noprint,.fab,.add,#modal{display:none!important}
  body{background:#fff} main{padding:0} .card,.section{break-inside:avoid;box-shadow:none;border:1px solid #ccc}
  @page{margin:12mm}
}
</style>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kr = n => new Intl.NumberFormat('sv-SE', {maximumFractionDigits: 0}).format(Math.round(n || 0)).replace(/ /g, ' ') + ' kr';

const num = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? 0 : n; };
const DAY = 86400000;

const isoWeek = ms => { const d = new Date(ms); d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7)); const y0 = Date.UTC(d.getUTCFullYear(), 0, 1); return Math.ceil(((d - y0) / DAY + 1) / 7); };

const S = {noStorage: false, rooms: [], items: [], prices: [], settings: {}, tab: 'oversikt', filter: 'alla',
  collapsed: {}, mode: 'local', status: '', user: null, loading: true};
const COLS = ['rooms', 'items', 'prices', 'settings'];

/* ---------- Datalager (lokalt eller Firebase) ---------- */
const Store = {
  fs: null, db: null, auth: null,
  uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); },
  persist() {
    try { localStorage.setItem('hus_v1', JSON.stringify({rooms: S.rooms, items: S.items, prices: S.prices, settings: S.settings})); }
    catch (e) { if (!S.noStorage) { S.noStorage = true; toast('Förhandsvisning: ändringar sparas inte permanent. Lägg filen på GitHub Pages för att använda den på riktigt.', true); } }
  },
  loadLocal() {
    try { const d = JSON.parse(localStorage.getItem('hus_v1') || '{}'); S.rooms = d.rooms || []; S.items = d.items || []; S.prices = d.prices || []; S.settings = d.settings || {}; } catch (e) {}
  },
  async save(col, id, data) {
    id = id || this.uid();
    if (S.mode === 'shared') {
      this.fs.setDoc(this.fs.doc(this.db, col, id), data, {merge: true}).catch(e => toast('Det gick inte att spara: ' + errText(e), true));
    } else {
      if (col === 'settings') S.settings = {...S.settings, ...data};
      else { const i = S[col].findIndex(x => x.id === id); if (i >= 0) S[col][i] = {...S[col][i], ...data}; else S[col].push({id, ...data}); }
      this.persist(); render();
    }
    return id;
  },
  async del(col, id) {
    if (S.mode === 'shared') this.fs.deleteDoc(this.fs.doc(this.db, col, id)).catch(e => toast('Det gick inte att ta bort: ' + errText(e), true));
    else { S[col] = S[col].filter(x => x.id !== id); this.persist(); render(); }
  }
};

async function initShared() {
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [a, au, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = a.initializeApp(FIREBASE_CONFIG);
  Store.fs = fs; Store.db = fs.getFirestore(app); Store.auth = au.getAuth(app);
  Store.signIn = pw => au.signInWithEmailAndPassword(Store.auth, SHARED_EMAIL, pw);
  Store.signOut = () => au.signOut(Store.auth);
  S.mode = 'shared';
  let unsubs = [];
  au.onAuthStateChanged(Store.auth, user => {
    S.user = user; S.loading = false;
    unsubs.forEach(u => u()); unsubs = [];
    if (user) COLS.forEach(c => unsubs.push(fs.onSnapshot(fs.collection(Store.db, c), snap => {
      const arr = snap.docs.map(d => ({id: d.id, ...d.data()}));
      if (c === 'settings') S.settings = arr.find(x => x.id === 'main') || {}; else S[c] = arr;
      S.status = ''; render();
    }, err => { S.status = 'Fel: ' + err.code; render(); })));
    render();
  });
}

/* ---------- Beräkningar ---------- */
const COVER_SEED = {};
SEED_PRICES.forEach(p => { if (p.cover) COVER_SEED[p.name] = p.cover; });
const coverDone = new Set();
function ensureCovers() {   // lägger en gång in 'täcker m²' på redan importerade standardartiklar
  S.prices.forEach(p => { if (p.cover === undefined && COVER_SEED[p.name] && !coverDone.has(p.id)) { coverDone.add(p.id); Store.save('prices', p.id, {cover: COVER_SEED[p.name]}); } });
}
const priceOf = id => S.prices.find(p => p.id === id);
const effQty = it => {
  const p = priceOf(it.priceId), c = p ? num(p.cover) : 0, a = num(it.area);
  if (p && c > 0 && a > 0) return Math.ceil(a * (1 + num(it.spill) / 100) / c - 1e-9);   // yta → antal, avrundat uppåt
  return num(it.qty);
};
const estOf = it => { if (it.priceId) { const p = priceOf(it.priceId); if (p) return num(p.price) * effQty(it); } return num(it.est); };
const hasActual = it => it.actual !== null && it.actual !== undefined && it.actual !== '';
const fcOf = it => hasActual(it) ? num(it.actual) : estOf(it);
const rooms = () => [...S.rooms].sort((a, b) => (a.order || 0) - (b.order || 0));
const roomById = id => S.rooms.find(r => r.id === id);
const itemsOf = (kind, roomId) => S.items.filter(i => i.kind === kind && (!roomId || i.room === roomId));
function stats(kind, roomId) {
  const its = itemsOf(kind, roomId);
  const budget = roomId ? num(roomById(roomId)?.[kind === 'reno' ? 'budgetReno' : 'budgetInred'])
    : S.rooms.reduce((s, r) => s + num(r[kind === 'reno' ? 'budgetReno' : 'budgetInred']), 0);
  return {n: its.length, done: its.filter(i => i.done).length, budget,
    est: its.reduce((s, i) => s + estOf(i), 0), actual: its.reduce((s, i) => s + (hasActual(i) ? num(i.actual) : 0), 0),
    fc: its.reduce((s, i) => s + fcOf(i), 0)};
}
const sumStats = (a, b) => ({n: a.n + b.n, done: a.done + b.done, budget: a.budget + b.budget, est: a.est + b.est, actual: a.actual + b.actual, fc: a.fc + b.fc});
const diffTxt = (budget, fc) => {
  if (!budget && !fc) return '';
  if (!budget) return 'Ingen budget satt';
  const d = budget - fc;
  return d >= 0 ? `${kr(d)} under budget` : `${kr(-d)} över budget`;
};

async function setHeroFile(file) {
  if (!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  await new Promise((ok, no) => { img.onload = ok; img.onerror = () => no(new Error('Kunde inte läsa bilden')); img.src = url; });
  const maxW = 1500, k = Math.min(1, maxW / img.width), c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
  let q = .8, d = c.toDataURL('image/jpeg', q);
  while (d.length > 700000 && q > .3) { q -= .1; d = c.toDataURL('image/jpeg', q); }
  await Store.save('settings', 'main', {hero: d}); toast('Bilden är sparad');
}

const TABS = [['oversikt', 'home', 'Översikt'], ['reno', 'hammer', 'Renovering'], ['inred', 'sofa', 'Inredning'], ['tid', 'calendar', 'Tidsplan'], ['pris', 'receipt', 'Prislista'], ['rapport', 'chart', 'Rapport'], ['hjalp', 'help', 'Hjälp']];

function render() {
  const app = $('#app');
  const title = S.settings.title || 'Villa Solviken';
  document.title = title;
  if (S.mode === 'shared' && !S.loading && !S.user) { app.innerHTML = loginHtml(); return; }
  if (S.mode === 'shared' && S.loading) { app.innerHTML = '<div class="login"><h2>Laddar…</h2></div>'; return; }
  const pill = S.status ? `<span class="pill warn">${esc(S.status)}</span>`
    : S.mode === 'shared' ? '<span class="pill">● Delad – uppdateras live</span>'
    : S.noStorage ? '<span class="pill warn">● Förhandsvisning – sparas inte</span>' : '<span class="pill warn">● Bara på den här enheten</span>';
  const scrollX = $('.gwrap')?.scrollLeft;
  app.innerHTML = `
  <header class="hero">${heroHtml()}<div class="wrap"><div class="top">${pill}</div><div class="brand">${LOGO}<div><h1>${esc(title)}</h1><small>Loftahammar · plan &amp; budget</small></div></div></div></header>
  <nav class="tabs"><div class="in">${TABS.map(([k, i, l]) => `<button data-act="tab" data-v="${k}" class="${S.tab === k ? 'on' : ''}">${ic(i, 18)}<span>${l}</span></button>`).join('')}</div></nav>

function view() {
  switch (S.tab) {
    case 'oversikt': return viewOverview();

  <div class="bar ${over ? 'over' : ''}"><i style="width:${w}%"></i></div></div>`;
}

/* ---------- Gantt ---------- */
function viewGantt() {
  const head = `<h2>Tidsplan</h2><p class="sub">Alla renoveringssaker med start- och slutdatum visas som staplar. Tryck på en stapel för att ändra datum.</p>`;
  const all = itemsOf('reno');
  const dated = all.filter(i => i.start && i.end && pd(i.end) >= pd(i.start));
  const undated = all.filter(i => !(i.start && i.end && pd(i.end) >= pd(i.start)));
  if (!dated.length) return head + `<div class="card empty"><h2>Inga datum ännu</h2><p class="sub">Lägg till start- och slutdatum på dina renoveringssaker så dyker tidsplanen upp här.</p></div>` + undatedList(undated);
  const W = 60;
  let min = monday(Math.min(...dated.map(i => pd(i.start)))) - 7 * DAY;
  let max = Math.max(...dated.map(i => pd(i.end))) + 14 * DAY;
  if (max - min < 12 * 7 * DAY) max = min + 12 * 7 * DAY;
  const weeks = Math.ceil((max - min) / (7 * DAY)), total = weeks * W;
  const x = ms => (ms - min) / DAY / 7 * W;
  let months = '', wk = '', lastM = '', mStart = 0, mLabel = '';
  const flushM = end => { if (mLabel) months += `<div class="g-m" style="left:${mStart * W}px;width:${(end - mStart) * W}px">${mLabel}</div>`; };
  for (let w = 0; w < weeks; w++) {
    const ms = min + w * 7 * DAY, d = new Date(ms + 3 * DAY);
    const mk = d.getUTCFullYear() + '-' + d.getUTCMonth();
    if (mk !== lastM) { flushM(w); mStart = w; mLabel = d.toLocaleDateString('sv-SE', {month: 'short', year: '2-digit', timeZone: 'UTC'}).replace('.', ''); lastM = mk; }
    wk += `<div class="g-w" style="left:${w * W}px;width:${W}px">v${isoWeek(ms + 3 * DAY)}</div>`;
  }
  flushM(weeks);
  const todayLine = TODAY >= min && TODAY <= max ? `<i class="today" style="left:${x(TODAY)}px"></i>` : '';
  let rows = `<div class="g-row g-head"><div class="g-lab">Vad</div><div class="g-track" style="--w:${W}px;width:${total}px;height:60px;background-image:none">${months}${wk}${todayLine}</div></div>`;
  rooms().forEach(r => {
    const its = dated.filter(i => i.room === r.id).sort((a, b) => pd(a.start) - pd(b.start));
    if (!its.length) return;
    rows += `<div class="g-row"><div class="g-lab room">${esc(r.name)}</div><div class="g-track room" style="--w:${W}px;width:${total}px;background-image:none"></div></div>`;
    its.forEach(i => {
      const s = pd(i.start), e = pd(i.end);
      const cls = i.done ? 'ok' : e < TODAY ? 'late' : s <= TODAY ? 'doing' : 'todo';
      const dep = i.dep ? S.items.find(z => z.id === i.dep) : null;
      const warn = !i.done && dep && dep.end && pd(dep.end) >= s;
      const left = x(s), width = Math.max(16, x(e + DAY) - left);
      rows += `<div class="g-row"><div class="g-lab" title="${esc(i.title)}">${i.done ? '✓ ' : ''}${esc(i.title)}</div>
        <div class="g-track" style="--w:${W}px;width:${total}px">${todayLine}
        <div class="g-bar ${cls}" data-act="edit" data-id="${i.id}" style="left:${left}px;width:${width}px" title="${esc(i.title)}: ${fmtD(s)}–${fmtD(e)}${warn ? ' – OBS: startar före att ' + esc(dep.title) + ' är klar' : ''}">${warn ? ic('alert', 12) + ' ' : ''}${fmtD(s)}–${fmtD(e)}</div></div></div>`;
    });
  });
  return head + `<div class="legend"><span><i style="background:var(--blue)"></i>Kommer</span><span><i style="background:var(--amber)"></i>Pågår nu</span><span><i style="background:var(--green)"></i>Klart</span><span><i style="background:var(--red)"></i>Försenat</span><span><i style="background:var(--clay)"></i>Idag</span><span>⚠ = startar före att något som måste vara klart först är klart</span></div>
  <div class="gwrap">${rows}</div>${undatedList(undated)}`;
}
function undatedList(und) {
  if (!und.length) return '';
  return `<div class="card" style="margin-top:14px"><b>Saknar datum (${und.length})</b><p class="sub" style="margin:4px 0 8px">Tryck för att lägga in start- och slutdatum.</p>
  ${und.map(i => `<div class="item" style="padding-left:0;padding-right:0" data-act="edit" data-id="${i.id}"><div class="t"><b>${esc(i.title)}</b><div class="meta">${esc(roomById(i.room)?.name || '')}</div></div></div>`).join('')}</div>`;
}

/* ---------- Rapport ---------- */
function viewReport() {
  const R = stats('reno'), I = stats('inred'), T = sumStats(R, I);
  const date = new Date().toLocaleDateString('sv-SE', {day: 'numeric', month: 'long', year: 'numeric'});
  if (!S.rooms.length) return '<div class="card empty"><p>Lägg in rum och saker först, så kan ni ta ut en rapport här.</p></div>';
  // per rum
  const rs = rooms().map((r, idx) => ({r, idx, R: stats('reno', r.id), I: stats('inred', r.id)})).map(o => ({...o, T: sumStats(o.R, o.I)}));
  const dc = v => `<span class="${v < 0 ? 'bad' : 'good'}">${v < 0 ? '−' : '+'}${kr(Math.abs(v))}</span>`;
  const tbl = `<table><thead><tr><th>Rum</th><th>Reno budget</th><th>Reno prognos</th><th>Avvikelse</th><th>Inred budget</th><th>Inred prognos</th><th>Avvikelse</th><th>Klart</th></tr></thead><tbody>
  ${rs.map(o => `<tr><td>${esc(o.r.name)}</td><td>${kr(o.R.budget)}</td><td>${kr(o.R.fc)}</td><td>${o.R.budget || o.R.fc ? dc(o.R.budget - o.R.fc) : ''}</td><td>${kr(o.I.budget)}</td><td>${kr(o.I.fc)}</td><td>${o.I.budget || o.I.fc ? dc(o.I.budget - o.I.fc) : ''}</td><td>${o.T.done}/${o.T.n}</td></tr>`).join('')}</tbody>
  <tfoot><tr><td>Totalt</td><td>${kr(R.budget)}</td><td>${kr(R.fc)}</td><td>${dc(R.budget - R.fc)}</td><td>${kr(I.budget)}</td><td>${kr(I.fc)}</td><td>${dc(I.budget - I.fc)}</td><td>${T.done}/${T.n}</td></tr></tfoot></table>`;
  // donut per rum
  const parts = rs.filter(o => o.T.fc > 0);

    off += len; return seg;
  }).join('');

  const types = Object.entries(byType).filter(e => e[1] > 0).sort((a, b) => b[1] - a[1]);
  const maxT = types.length ? types[0][1] : 1;
  const typeBars = types.map(([k, v]) => `<div class="hbar"><span>${esc(k)}</span><div class="bar"><i style="width:${v / maxT * 100}%"></i></div><b style="text-align:right">${kr(v)}</b></div>`).join('') || '<p class="sub">–</p>';
  // listor
  const open = S.items.filter(i => !i.done).sort((a, b) => (a.start || '9') < (b.start || '9') ? -1 : 1);

    ${over.map(o => `<li>${esc(o.r.name)} ligger över budget${o.R.budget && o.R.fc > o.R.budget ? ` på renovering (${kr(o.R.fc - o.R.budget)} över)` : ''}${o.I.budget && o.I.fc > o.I.budget ? ` på inredning (${kr(o.I.fc - o.I.budget)} över)` : ''}</li>`).join('')}
    ${late.map(i => `<li>Försenat: ${esc(i.title)} (skulle vara klart ${fmtD(pd(i.end))})</li>`).join('')}</ul></div>` : '';
  const d = T.budget - T.fc;
  return `<div class="rep"><div class="row spread wrapx noprint"><h2 style="margin:0">Rapport</h2><div class="row"><button class="btn ghost" data-act="csv">${ic('download', 16)} Excel (CSV)</button><button class="btn" data-act="print">${ic('printer', 16)} Skriv ut / spara PDF</button></div></div>
  <h1 style="margin:18px 0 2px">${esc(S.settings.title || 'Villa Solviken')}</h1><div class="sub" style="margin-top:0">Statusrapport ${date}</div>
  <div class="grid g4" style="margin-bottom:12px">
    <div class="card stat"><div class="lbl">Budget</div><div class="val">${kr(T.budget)}</div></div>
    <div class="card stat"><div class="lbl">Prognos</div><div class="val">${kr(T.fc)}</div><div class="note ${T.budget && d < 0 ? 'bad' : 'good'}"><b>${diffTxt(T.budget, T.fc)}</b></div></div>
    <div class="card stat"><div class="lbl">Betalt hittills</div><div class="val">${kr(T.actual)}</div></div>
    <div class="card stat"><div class="lbl">Klart</div><div class="val">${T.done} av ${T.n}</div><div class="note">${pct(T.done, T.n)}%</div></div></div>
  ${watch}
  <h2>Vart går pengarna?</h2><div class="grid g2"><div class="card"><b>Per rum</b><div style="margin-top:10px">${donut}</div></div><div class="card"><b>Per typ av kostnad</b><div style="margin-top:10px">${typeBars}</div></div></div>
  <h2>Budget mot prognos per rum</h2><div class="card scrollx">${tbl}</div>
  <p class="sub" style="margin-top:8px">Prognos = faktisk kostnad där den är inlagd, annars uppskattad kostnad. Avvikelse: grönt = under budget, rött = över.</p>
  <h2>Kvar att göra (${open.length})</h2><div class="card">${open.length ? `<ul>${open.map(li).join('')}</ul>` : 'Allt är klart!'}</div>
  <h2>Klart (${doneL.length})</h2><div class="card">${doneL.length ? `<ul>${doneL.map(li).join('')}</ul>` : 'Inget avbockat ännu.'}</div></div>`;

/* ---------- Periodkalender ---------- */
const CAL = {s: null, e: null, v: 0};
const isoD = ms => new Date(ms).toISOString().slice(0, 10);
function calInit(it) {
  CAL.s = it.start ? pd(it.start) : null; CAL.e = it.end ? pd(it.end) : (CAL.s || null);
  const d = new Date(CAL.s || TODAY); CAL.v = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
}
function calRender() {
  const box = $('#cal'); if (!box) return;
  const v = new Date(CAL.v), y = v.getUTCFullYear(), m = v.getUTCMonth();
  const lead = (new Date(Date.UTC(y, m, 1)).getUTCDay() + 6) % 7, days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  let cells = '<i></i>'.repeat(lead);
  for (let d = 1; d <= days; d++) {
    const ms = Date.UTC(y, m, d), c = [];
    if (ms === TODAY) c.push('today');
    if (ms === CAL.s) c.push('st'); if (ms === CAL.e) c.push('en');
    if (CAL.s && CAL.e && ms > CAL.s && ms < CAL.e) c.push('mid');
    cells += `<button type="button" class="cd ${c.join(' ')}" data-act="calDay" data-v="${ms}">${d}</button>`;
  }
  const label = v.toLocaleDateString('sv-SE', {month: 'long', year: 'numeric', timeZone: 'UTC'});
  const sum = !CAL.s ? '<span class="hint">Tryck på första dagen</span>'
    : CAL.s === CAL.e ? `${fmtD(CAL.s)} <span class="hint">(en dag)</span>`
    : !CAL.e ? `Start ${fmtD(CAL.s)} <span class="hint">– tryck på sista dagen</span>`
    : `${fmtD(CAL.s)} – ${fmtD(CAL.e)} <span class="hint">(${(CAL.e - CAL.s) / DAY + 1} dagar)</span>`;
  box.innerHTML = `<div class="ch"><button type="button" data-act="calPrev" aria-label="Föregående månad">‹</button><b>${label}</b><button type="button" data-act="calNext" aria-label="Nästa månad">›</button></div>
  <div class="g7">${['Mån', 'Tis', 'Ons', 'Tor', 'Fre', 'Lör', 'Sön'].map(w => `<div class="wd">${w}</div>`).join('')}${cells}</div>
  <div class="sum"><span>${sum}</span>${CAL.s ? '<button type="button" class="btn ghost small" data-act="calClear">Rensa</button>' : ''}</div>`;
  const f = $('#itemform'); if (f) { f.elements.start.value = CAL.s ? isoD(CAL.s) : ''; f.elements.end.value = CAL.s ? isoD(CAL.e || CAL.s) : ''; }
}
function calPick(ms) {
  if (!CAL.s || CAL.e) { CAL.s = ms; CAL.e = null; CAL.picked = false; }      // första trycket: ny period
  else if (ms < CAL.s) { CAL.e = CAL.s; CAL.s = ms; CAL.picked = true; }      // andra trycket före start: byt plats
  else { CAL.e = ms; CAL.picked = true; }                                      // andra trycket: sista dagen
  calRender();
}
function calMonth(delta) { const d = new Date(CAL.v); CAL.v = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + delta, 1); calRender(); }

function refreshItemForm() {
  const f = $('#itemform'); if (!f || f.dataset.kind !== 'reno') return;
  const type = f.elements.type.value, mat = type === 'Material' || type === 'Hantverkare';
  $('#matbox').style.display = mat ? '' : 'none';
  if (mat && f.dataset.ptype !== type) {
    const sel = f.elements.priceId, cur = f.dataset.ptype === undefined ? (S.items.find(x => x.id === f.dataset.id)?.priceId || '') : sel.value;
    const list = S.prices.filter(p => (p.unit === 'timme') === (type === 'Hantverkare'));
    sel.innerHTML = `<option value="">– Skriv in en summa själv –</option>` + list.map(p => `<option value="${p.id}" ${p.id === cur ? 'selected' : ''}>${esc(p.name)} (${krP(num(p.price))}/${esc(p.unit)})</option>`).join('');
    $('#pricelabel').textContent = type === 'Hantverkare' ? 'Timarvode ur prislistan (valfritt)' : 'Material ur prislistan (valfritt)';
    f.dataset.ptype = type;
  }
  const pid = mat ? f.elements.priceId.value : '';
  $('#qtybox').style.display = pid ? '' : 'none';
  $('#estbox').style.display = pid ? 'none' : '';
  const p = priceOf(pid), cov = p ? num(p.cover) : 0;
  $('#areabox').style.display = p && cov > 0 ? '' : 'none';
  const area = num(f.elements.area.value), spill = num(f.elements.spill.value);
  let q = num(f.elements.qty.value), extra = '';
  if (p && cov > 0 && area > 0) {
    q = Math.ceil(area * (1 + spill / 100) / cov - 1e-9);
    extra = `${f.elements.area.value} m² + ${spill} % spill = ${(area * (1 + spill / 100)).toFixed(1).replace('.', ',')} m² → `;
  }
  $('#calc').textContent = p && !num(p.price) ? 'Priset är inte satt än. Fyll i det i prislistan, så räknas kostnaden ut automatiskt.' : p ? `${extra}${q} ${p.unit} × ${krP(num(p.price))} = ${kr(num(p.price) * q)}` : '';
}
async function submitItem(f) {
  const d = new FormData(f), kind = f.dataset.kind, id = f.dataset.id || null;
  const isReno = kind === 'reno';
  const useP = isReno && (d.get('type') === 'Material' || d.get('type') === 'Hantverkare') && d.get('priceId');
  const actualRaw = String(d.get('actual') || '').trim();
  const data = {kind, room: d.get('room'), title: String(d.get('title')).trim(), type: d.get('type'),
    priceId: useP ? d.get('priceId') : '', qty: useP ? num(d.get('qty')) : null, est: useP ? 0 : num(d.get('est')),
    actual: actualRaw === '' ? null : num(actualRaw), done: d.get('done') === 'on', note: String(d.get('note') || '').trim()};
  const pr = useP ? priceOf(d.get('priceId')) : null, useArea = !!(pr && num(pr.cover) > 0 && num(d.get('area')) > 0);
  data.area = useArea ? num(d.get('area')) : null; data.spill = useArea ? num(d.get('spill')) : null;
  if (isReno) Object.assign(data, {who: String(d.get('who') || '').trim(), start: d.get('start') || '', end: d.get('end') || '', dep: d.get('dep') || ''});
  else Object.assign(data, {store: String(d.get('store') || '').trim(), prio: d.get('prio') || 'Bra att ha'});
  if (!id) data.created = Date.now();
  if (!data.title) return;
  if (isReno) {
    if (data.start && !data.end) data.end = data.start;
    if (data.end && !data.start) data.start = data.end;
    if (data.start && data.end && pd(data.end) < pd(data.start)) { $('#formerr').textContent = 'Slutdatumet ligger före startdatumet. Rätta datumen så sparas det.'; return; }
  }
  try { await Store.save('items', id, data); closeModal(); toast('Sparat ✓'); }
  catch (err) { $('#formerr').textContent = 'Det gick inte att spara: ' + errText(err); }
}

  const p = id ? priceOf(id) : hour ? {name: '', unit: 'timme', price: '', source: ''} : {name: '', unit: 'st', price: '', source: ''};
  openModal(`<h2>${id ? 'Ändra artikel' : hour ? 'Ny hantverkare' : 'Ny artikel'}</h2><form id="priceform" data-id="${id || ''}">
  <div class="f"><label>Artikel</label><input type="text" name="name" value="${esc(p.name)}" placeholder="${hour ? 't.ex. Målare – timarvode' : 't.ex. Gipsskiva 13 mm 900×2400'}"></div>
  <div class="f2"><div class="f"><label>Enhet</label><select name="unit">${UNITS.map(u => `<option ${u === p.unit ? 'selected' : ''}>${u}</option>`).join('')}</select></div>
  <div class="f"><label>Pris per enhet (kr, inkl. moms)</label><input type="text" inputmode="decimal" autocomplete="off" name="price" value="${esc(p.price)}" placeholder="${hour ? 'Lämna tomt om ni inte vet än' : ''}" ><div class="hint">${hour || p.unit === 'timme' ? 'Timarvode inklusive moms (pris exkl. moms × 1,25). Kan fyllas i senare.' : ''}</div></div></div>
  <div class="f"><label>Täcker (m² per enhet, valfritt)</label><input type="text" inputmode="decimal" autocomplete="off" name="cover" value="${esc(num(p.cover) ? String(p.cover).replace('.', ',') : '')}" placeholder="t.ex. 2,16 för en gipsskiva 2400×900"><div class="hint">Fyll i om ni vill kunna skriva in en yta i stället för antal. För artiklar som säljs per meter: m² per löpmeter, till exempel 0,095 för 95 mm bredd.</div></div>
  <div class="f"><label>Källa</label><input type="text" name="source" value="${esc(p.source || '')}" placeholder="t.ex. Anders Trä, faktura 2026-10-12"></div>
  <div id="formerr" class="bad" style="margin-top:6px;font-weight:600"></div><div class="btns"><button class="btn" type="button" data-act="submitForm">Spara</button><button class="btn ghost" type="button" data-act="closeModal">Avbryt</button>${id ? '<button class="btn danger" type="button" data-act="delPrice" data-id="' + id + '">Ta bort</button>' : ''}</div></form>`);
}

/* ---------- CSV ---------- */
function csv() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const head = ['Rum', 'Lista', 'Typ', 'Vad', 'Uppskattat (kr)', 'Faktiskt (kr)', 'Prognos (kr)', 'Klart', 'Start', 'Slut', 'Ansvarig', 'Butik'];
  const rows = S.items.map(i => [roomById(i.room)?.name, i.kind === 'reno' ? 'Renovering' : 'Inredning', i.type, i.title, estOf(i), hasActual(i) ? i.actual : '', fcOf(i), i.done ? 'Ja' : 'Nej', i.start, i.end, i.who, i.store]);
  const text = '﻿' + [head, ...rows].map(r => r.map(q).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: 'text/csv;charset=utf-8'}));
  a.download = 'renovering-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
}

/* ---------- Händelser ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if (a === 'toggle') { e.stopPropagation(); const it = S.items.find(x => x.id === id); if (it) await Store.save('items', id, {done: !it.done}); return; }
  switch (a) {
    case 'tab': S.tab = v; render(); window.scrollTo(0, 0); break;
    case 'filter': S.filter = v; render(); break;
    case 'collapse': S.collapsed[v] = !S.collapsed[v]; render(); break;
    case 'new': if (!S.rooms.length) { S.tab = 'oversikt'; render(); break; } itemForm(el.dataset.kind, null, el.dataset.room); break;
    case 'edit': { const it = S.items.find(x => x.id === id); if (it) itemForm(it.kind, id); break; }
    case 'roomNew': roomForm(); break;
    case 'roomEdit': roomForm(id); break;
    case 'priceNew': priceForm(); break;
    case 'priceNewHour': priceForm(null, true); break;
    case 'priceEdit': priceForm(id); break;
    case 'closeModal': closeModal(); break;
    case 'calDay': calPick(Number(v)); break;
    case 'calPrev': calMonth(-1); break;
    case 'calNext': calMonth(1); break;
    case 'calClear': CAL.s = CAL.e = null; CAL.picked = false; calRender(); break;
    case 'submitForm': handleForm(el.closest('form')); break;
    case 'seedRooms': {
      const base = Date.now();
      for (let i = 0; i < DEFAULT_ROOMS.length; i++) await Store.save('rooms', null, {name: DEFAULT_ROOMS[i][0], emoji: DEFAULT_ROOMS[i][1], budgetReno: 0, budgetInred: 0, order: base + i});
      break;
    }
    case 'seedPrices': for (const p of SEED_PRICES) if (!S.prices.some(x => x.name === p.name)) await Store.save('prices', null, p); break;
    case 'delItem': if (confirm('Ta bort den här posten?')) { closeModal(); await Store.del('items', id); } break;
    case 'delPrice': if (confirm('Ta bort artikeln? Poster som använder den behåller inte priset.')) { closeModal(); await Store.del('prices', id); } break;
    case 'delRoom': {
      const n = S.items.filter(i => i.room === id).length;
      if (confirm(n ? `Rummet har ${n} poster som också tas bort. Fortsätta?` : 'Ta bort rummet?')) {
        closeModal(); for (const i of S.items.filter(i => i.room === id)) await Store.del('items', i.id); await Store.del('rooms', id);
      } break;
    }
    case 'print': window.print(); break;
    case 'csv': csv(); break;
    case 'saveTitle': await Store.save('settings', 'main', {title: $('#s_title').value.trim()}); break;
    case 'heroClear': await Store.save('settings', 'main', {hero: ''}); break;
    case 'logout': Store.signOut(); break;
  }
});
async function handleForm(f) {
  const err = m => { const e = $('#formerr'); if (e) e.textContent = m; };
  try {
    if (f.id === 'itemform') {
      if (!f.elements.title.value.trim()) return err('Skriv vad som ska göras eller köpas.');
      if (!f.elements.room.value) return err('Välj ett rum.');
      return await submitItem(f);
    }
    if (f.id === 'roomform') {
      const d = new FormData(f), id = f.dataset.id || null, name = String(d.get('name')).trim();
      if (!name) return err('Skriv ett namn på rummet.');
      const data = {name, budgetReno: num(d.get('budgetReno')), budgetInred: num(d.get('budgetInred'))};
      if (!id) { data.emoji = '🏠'; data.order = Date.now(); }
      await Store.save('rooms', id, data); closeModal(); toast('Sparat ✓'); return;
    }
    if (f.id === 'priceform') {
      const d = new FormData(f), id = f.dataset.id || null, name = String(d.get('name')).trim();
      if (!name) return err('Skriv ett namn på artikeln.');
      if (!String(d.get('price')).trim() && d.get('unit') !== 'timme') return err('Skriv ett pris per enhet.');
      await Store.save('prices', id, {name, unit: d.get('unit'), price: num(d.get('price')), cover: num(d.get('cover')), source: String(d.get('source') || '').trim()});
      closeModal(); toast('Sparat ✓'); return;
    }
    if (f.id === 'login') {
      try { await Store.signIn($('#pw').value); } catch (e) { $('#loginerr').textContent = 'Fel lösenord, försök igen.'; }
    }
  } catch (e) { err('Det gick inte att spara: ' + errText(e)); }
}
document.addEventListener('change', async e => { if (e.target.id === 'heroFile') { try { await setHeroFile(e.target.files[0]); } catch (err) { toast(errText(err), true); } } });
document.addEventListener('submit', e => { e.preventDefault(); handleForm(e.target); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input:not([type=checkbox]):not([type=radio])') && e.target.form) { e.preventDefault(); handleForm(e.target.form); }
});

/* ---------- Start ---------- */
(async function start() {
  if (FIREBASE_CONFIG) {
    try { await initShared(); return; }
    catch (err) { console.error(err); S.mode = 'local'; S.status = 'Kunde inte ansluta till Firebase'; }
  }
  Store.loadLocal(); S.loading = false; render();
})();
</script>
</body>
