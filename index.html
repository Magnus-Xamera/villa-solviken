<html lang="sv">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Villa Solviken</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#f8f4ec; --card:#fff; --ink:#1f3440; --muted:#69808a; --line:#e8e1d3;
  --green:#2b7a78; --green-d:#17495a; --green-l:#e0f0ef;
  --clay:#e07a5f; --clay-l:#fbe8e1;
  --amber:#e9b44c; --amber-l:#fbf1d8;
  --blue:#4a86a8; --blue-l:#e3eff5;
  --red:#c0453b; --red-l:#f9e2df;
  --sand:#efe6d4; --sky:#d4e8ec;
  --r:18px; --shadow:0 1px 2px rgba(23,73,90,.06),0 6px 18px rgba(23,73,90,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
.hero{position:relative;background:linear-gradient(180deg,var(--sky) 0%,#e9f2ef 62%,var(--bg) 100%);padding:22px 0 46px;overflow:hidden}
.hero .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand h1{font-family:Fraunces,Georgia,serif;font-size:clamp(28px,7vw,40px);font-weight:700;color:var(--green-d);letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.pill{font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;background:#fff;color:var(--green-d);white-space:nowrap;box-shadow:var(--shadow)}
.pill.warn{background:var(--amber-l);color:#7a5200}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:34px;display:block}
nav.tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:rgba(248,244,236,.92);backdrop-filter:blur(10px);scrollbar-width:none;border-bottom:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs .in{display:flex;gap:6px;max-width:1100px;margin:0 auto;width:100%}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);padding:9px 15px;border-radius:99px;font-weight:700;font-size:14.5px}
nav.tabs button:hover{background:var(--sand)}
nav.tabs button.on{background:var(--green-d);color:#fff}
main{padding:18px 0 90px}
.sub{color:var(--muted);margin:4px 0 16px}
.card{background:var(--card);border:1px solid rgba(232,225,211,.7);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat .lbl{font-size:13px;color:var(--muted);font-weight:600}
.stat.hero2{background:linear-gradient(135deg,var(--green-d),var(--green));color:#fff;border:0}
.stat.hero2 .lbl,.stat.hero2 .note{color:#d3e8e6}
.stat.hero2 .good{color:#c8f0d4}.stat.hero2 .bad{color:#ffd2cb}
.stat .val{font-family:Fraunces,Georgia,serif;font-size:clamp(20px,5.5vw,28px);font-weight:700;letter-spacing:-.02em;margin:2px 0}
.stat .note{font-size:13px;color:var(--muted)}
.good{color:var(--green)} .bad{color:var(--red)}
.bar{height:10px;background:#ece6d9;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:99px}
.bar.over>i{background:var(--red)}
.bar.done>i{background:var(--green)}
.btn{border:0;border-radius:99px;padding:12px 22px;font-weight:700;background:var(--green-d);color:#fff;box-shadow:0 2px 6px rgba(23,73,90,.18)}
.btn:hover{background:var(--green)}
.btn.ghost{background:var(--green-l);color:var(--green-d);box-shadow:none}
.btn.ghost:hover{background:#d3e6dc}
.btn.danger{background:var(--red-l);color:var(--red)}
.btn.small{padding:8px 14px;font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.wrapx{flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.chip.on{background:var(--green-d);border-color:var(--green-d);color:#fff}
.roomhead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--green-l);border-radius:var(--r) var(--r) 0 0;cursor:pointer}
.roomhead .nm{font-weight:700;flex:1}
.roomhead .tot{font-size:14px;color:var(--green-d);font-weight:600;text-align:right}
.section{margin-bottom:14px;background:#fff;border:1px solid rgba(232,225,211,.7);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.item:hover{background:#faf8f4}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600}
.item.isdone .t b{text-decoration:line-through;color:var(--muted)}
.item .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.item .amt{text-align:right;white-space:nowrap;font-weight:700}
.item .amt small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.chk{width:30px;height:30px;border-radius:9px;border:2px solid #c9c2b5;background:#fff;color:#fff;font-size:18px;line-height:1;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--green);border-color:var(--green)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--blue-l);color:var(--blue);font-weight:600}
.tag.warn{background:var(--red-l);color:var(--red)}
.add{display:block;width:100%;border:0;border-top:1px dashed var(--line);background:#fff;padding:12px;color:var(--green);font-weight:700}
.add:hover{background:var(--green-l)}
.empty{text-align:center;padding:30px 16px}
.empty h2{margin-bottom:6px}
.steps{display:grid;gap:10px;margin:14px 0}
.steps .s{display:flex;gap:12px;align-items:flex-start}
.steps .n{width:30px;height:30px;border-radius:50%;background:var(--clay);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.roomcard h3{display:flex;gap:8px;align-items:center;font-size:17px}
.roomcard .kv{margin-top:12px}
.roomcard .kv .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.roomcard .kv .top span:first-child{font-weight:600}
.roomcard .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
/* modal */
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:90;max-width:90vw;padding:12px 18px;border-radius:14px;background:var(--green-d);color:#fff;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none;text-align:center}
#toast.err{background:var(--red)}
#modal{position:fixed;inset:0;height:100dvh;background:rgba(20,30,26,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:26px 26px 0 0;padding:20px 18px 0}
@media(min-width:640px){#modal{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin-bottom:14px}
.f{margin-bottom:14px}
.f label{display:block;font-weight:600;margin-bottom:5px;font-size:15px}
.f .hint{font-size:13px;color:var(--muted);margin-top:4px}
.f input[type=text],.f input[type=number],.f input[type=date],.f input[type=password],.f select,.f textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--green);border-color:var(--green)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts label{margin:0;font-weight:600}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:inline-block;border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;font-size:14px;cursor:pointer}
.opts input:checked+span{background:var(--green-d);border-color:var(--green-d);color:#fff}
.calc{background:var(--green-l);border-radius:10px;padding:10px 12px;font-weight:700;color:var(--green-d)}
.donecheck{display:flex;gap:10px;align-items:center;font-weight:700;padding:12px;background:var(--green-l);border-radius:10px}
.donecheck input{width:22px;height:22px}
.sheet .btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;position:sticky;bottom:0;background:#fff;padding:12px 0 18px;border-top:1px solid var(--line)}
.sheet .btns .btn{flex:1}
/* kalender */
.cal{border:1.5px solid var(--line);border-radius:14px;padding:10px;background:#fff}
.cal .ch{display:flex;align-items:center;justify-content:space-between;font-weight:700;text-transform:capitalize}
.cal .ch button{border:0;background:var(--green-l);color:var(--green-d);width:38px;height:38px;border-radius:50%;font-size:20px;line-height:1}
.cal .g7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px}
.cd{border:0;background:transparent;aspect-ratio:1;min-height:36px;border-radius:10px;font:inherit;font-weight:600;color:var(--ink);padding:0}
.cd:hover{background:var(--sand)}
.cd.today{outline:2px solid var(--clay);outline-offset:-2px}
.cd.mid{background:var(--green-l);border-radius:4px}
.cd.st,.cd.en{background:var(--green-d);color:#fff}
.cal .sum{margin-top:10px;font-weight:700;color:var(--green-d);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cal .sum .hint{font-weight:500}
/* gantt */
.gwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.g-row{display:flex;border-top:1px solid var(--line);min-height:40px}
.g-lab{flex:0 0 170px;position:sticky;left:0;background:#fff;z-index:2;padding:9px 10px;font-size:14px;border-right:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-lab.room{background:var(--green-l);font-weight:700;color:var(--green-d)}
.g-track{position:relative;flex:0 0 auto;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(var(--w) - 1px),#efeae1 calc(var(--w) - 1px),#efeae1 var(--w))}
.g-track.room{background-color:var(--green-l)}
.g-head .g-lab{font-weight:700}
.g-m{position:absolute;top:0;height:30px;border-left:1px solid var(--line);padding:7px 6px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:clip}
.g-w{position:absolute;top:30px;bottom:0;text-align:center;font-size:11px;color:var(--muted);padding-top:6px}
.g-bar{position:absolute;top:8px;height:24px;border-radius:7px;color:#fff;font-size:12px;font-weight:700;padding:3px 8px;overflow:hidden;white-space:nowrap;cursor:pointer;min-width:16px}
.g-bar.todo{background:var(--blue)} .g-bar.doing{background:var(--amber);color:#4a3200} .g-bar.late{background:var(--red)} .g-bar.ok{background:var(--green)}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--clay);z-index:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}
/* tables */
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.scrollx{overflow-x:auto}
.legendlist{display:grid;gap:6px;font-size:14px}
.legendlist div{display:flex;align-items:center;gap:8px}
.legendlist i{width:12px;height:12px;border-radius:4px;flex:0 0 auto}
.legendlist b{margin-left:auto;padding-left:10px}
.hbar{display:grid;grid-template-columns:120px 1fr 100px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.hbar .bar{height:14px}
.rep h2{margin:22px 0 10px;font-size:20px}
.rep ul{margin:6px 0 0;padding-left:20px}
.login{max-width:380px;margin:60px auto;text-align:center}
.fab{position:fixed;right:16px;bottom:16px;z-index:15;box-shadow:0 8px 22px rgba(23,73,90,.35);border-radius:99px;padding:15px 24px;background:var(--clay)}
.fab:hover{background:#d26a4f}
@media print{
  .hero,nav.tabs,.noprint,.fab,.add,#modal{display:none!important}
  body{background:#fff} main{padding:0} .card,.section{break-inside:avoid;border-color:#ccc}
  @page{margin:12mm}
}
</style>

let toastT;
function toast(msg, err) {

  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', err ? 6000 : 1800);
}
const errText = e => { const c = e && (e.code || e.message || String(e)); return c === 'permission-denied' || c === 'Missing or insufficient permissions.' ? 'Saknar behörighet i Firebase. Kontrollera reglerna och att ni är inloggade.' : String(c || 'okänt fel'); };

const S = {noStorage: false, rooms: [], items: [], prices: [], settings: {}, tab: 'oversikt', filter: 'alla',
  collapsed: {}, mode: 'local', status: '', user: null, loading: true};

/* ---------- Datalager (lokalt eller Firebase) ---------- */
const Store = {
  fs: null, db: null, auth: null,
  uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); },
  persist() {
    try { localStorage.setItem('hus_v1', JSON.stringify({rooms: S.rooms, items: S.items, prices: S.prices, settings: S.settings})); }
    catch (e) { if (!S.noStorage) { S.noStorage = true; toast('Förhandsvisning: ändringar sparas inte permanent. Lägg filen på GitHub Pages för att använda den på riktigt.', true); } }
  },
  loadLocal() {
    try { const d = JSON.parse(localStorage.getItem('hus_v1') || '{}'); S.rooms = d.rooms || []; S.items = d.items || []; S.prices = d.prices || []; S.settings = d.settings || {}; } catch (e) {}
  },
  async save(col, id, data) {
    id = id || this.uid();
    if (S.mode === 'shared') {
      this.fs.setDoc(this.fs.doc(this.db, col, id), data, {merge: true}).catch(e => toast('Det gick inte att spara: ' + errText(e), true));
    } else {
      if (col === 'settings') S.settings = {...S.settings, ...data};
      else { const i = S[col].findIndex(x => x.id === id); if (i >= 0) S[col][i] = {...S[col][i], ...data}; else S[col].push({id, ...data}); }
      this.persist(); render();
    }
    return id;
  },
  async del(col, id) {
    if (S.mode === 'shared') this.fs.deleteDoc(this.fs.doc(this.db, col, id)).catch(e => toast('Det gick inte att ta bort: ' + errText(e), true));
    else { S[col] = S[col].filter(x => x.id !== id); this.persist(); render(); }
  }
};

async function initShared() {
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [a, au, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = a.initializeApp(FIREBASE_CONFIG);
  Store.fs = fs; Store.db = fs.getFirestore(app); Store.auth = au.getAuth(app);
  Store.signIn = pw => au.signInWithEmailAndPassword(Store.auth, SHARED_EMAIL, pw);
  Store.signOut = () => au.signOut(Store.auth);
  S.mode = 'shared';
  let unsubs = [];
  au.onAuthStateChanged(Store.auth, user => {
    S.user = user; S.loading = false;
    unsubs.forEach(u => u()); unsubs = [];
    if (user) COLS.forEach(c => unsubs.push(fs.onSnapshot(fs.collection(Store.db, c), snap => {
      const arr = snap.docs.map(d => ({id: d.id, ...d.data()}));
      if (c === 'settings') S.settings = arr.find(x => x.id === 'main') || {}; else S[c] = arr;
      S.status = ''; render();
    }, err => { S.status = 'Fel: ' + err.code; render(); })));
    render();
  });
}

const priceOf = id => S.prices.find(p => p.id === id);
const estOf = it => { if (it.priceId) { const p = priceOf(it.priceId); if (p) return num(p.price) * num(it.qty); } return num(it.est); };
const hasActual = it => it.actual !== null && it.actual !== undefined && it.actual !== '';
const fcOf = it => hasActual(it) ? num(it.actual) : estOf(it);
const rooms = () => [...S.rooms].sort((a, b) => (a.order || 0) - (b.order || 0));
const roomById = id => S.rooms.find(r => r.id === id);
const itemsOf = (kind, roomId) => S.items.filter(i => i.kind === kind && (!roomId || i.room === roomId));
function stats(kind, roomId) {
  const its = itemsOf(kind, roomId);
  const budget = roomId ? num(roomById(roomId)?.[kind === 'reno' ? 'budgetReno' : 'budgetInred'])
    : S.rooms.reduce((s, r) => s + num(r[kind === 'reno' ? 'budgetReno' : 'budgetInred']), 0);
  return {n: its.length, done: its.filter(i => i.done).length, budget,
    est: its.reduce((s, i) => s + estOf(i), 0), actual: its.reduce((s, i) => s + (hasActual(i) ? num(i.actual) : 0), 0),
    fc: its.reduce((s, i) => s + fcOf(i), 0)};
}
const sumStats = (a, b) => ({n: a.n + b.n, done: a.done + b.done, budget: a.budget + b.budget, est: a.est + b.est, actual: a.actual + b.actual, fc: a.fc + b.fc});
const diffTxt = (budget, fc) => {
  if (!budget && !fc) return '';
  if (!budget) return 'Ingen budget satt';
  const d = budget - fc;
  return d >= 0 ? `${kr(d)} under budget` : `${kr(-d)} över budget`;
};

  const flushM = end => { if (mLabel) months += `<div class="g-m" style="left:${mStart * W}px;width:${(end - mStart) * W}px">${mLabel}</div>`; };
  for (let w = 0; w < weeks; w++) {
    const ms = min + w * 7 * DAY, d = new Date(ms + 3 * DAY);
    const mk = d.getUTCFullYear() + '-' + d.getUTCMonth();
    if (mk !== lastM) { flushM(w); mStart = w; mLabel = d.toLocaleDateString('sv-SE', {month: 'short', year: '2-digit', timeZone: 'UTC'}).replace('.', ''); lastM = mk; }
    wk += `<div class="g-w" style="left:${w * W}px;width:${W}px">v${isoWeek(ms + 3 * DAY)}</div>`;
  }
  flushM(weeks);
  const todayLine = TODAY >= min && TODAY <= max ? `<i class="today" style="left:${x(TODAY)}px"></i>` : '';
  let rows = `<div class="g-row g-head"><div class="g-lab">Vad</div><div class="g-track" style="--w:${W}px;width:${total}px;height:60px;background-image:none">${months}${wk}${todayLine}</div></div>`;
  rooms().forEach(r => {
    const its = dated.filter(i => i.room === r.id).sort((a, b) => pd(a.start) - pd(b.start));
    if (!its.length) return;
    rows += `<div class="g-row"><div class="g-lab room">${esc(r.emoji || '')} ${esc(r.name)}</div><div class="g-track room" style="--w:${W}px;width:${total}px;background-image:none"></div></div>`;
    its.forEach(i => {
      const s = pd(i.start), e = pd(i.end);
      const cls = i.done ? 'ok' : e < TODAY ? 'late' : s <= TODAY ? 'doing' : 'todo';
      const dep = i.dep ? S.items.find(z => z.id === i.dep) : null;
      const warn = !i.done && dep && dep.end && pd(dep.end) >= s;
      const left = x(s), width = Math.max(16, x(e + DAY) - left);
      rows += `<div class="g-row"><div class="g-lab" title="${esc(i.title)}">${i.done ? '✓ ' : ''}${esc(i.title)}</div>
        <div class="g-track" style="--w:${W}px;width:${total}px">${todayLine}
        <div class="g-bar ${cls}" data-act="edit" data-id="${i.id}" style="left:${left}px;width:${width}px" title="${esc(i.title)}: ${fmtD(s)}–${fmtD(e)}${warn ? ' – OBS: startar före att ' + esc(dep.title) + ' är klar' : ''}">${warn ? '⚠ ' : ''}${fmtD(s)}–${fmtD(e)}</div></div></div>`;
    });
  });
  return head + `<div class="legend"><span><i style="background:var(--blue)"></i>Kommer</span><span><i style="background:var(--amber)"></i>Pågår nu</span><span><i style="background:var(--green)"></i>Klart</span><span><i style="background:var(--red)"></i>Försenat</span><span><i style="background:var(--clay)"></i>Idag</span><span>⚠ = startar före att något som måste vara klart först är klart</span></div>
  <div class="gwrap">${rows}</div>${undatedList(undated)}`;
}
function undatedList(und) {
  if (!und.length) return '';
  return `<div class="card" style="margin-top:14px"><b>Saknar datum (${und.length})</b><p class="sub" style="margin:4px 0 8px">Tryck för att lägga in start- och slutdatum.</p>
  ${und.map(i => `<div class="item" style="padding-left:0;padding-right:0" data-act="edit" data-id="${i.id}"><div class="t"><b>${esc(i.title)}</b><div class="meta">${esc(roomById(i.room)?.name || '')}</div></div></div>`).join('')}</div>`;
}

/* ---------- Rapport ---------- */
function viewReport() {
  const R = stats('reno'), I = stats('inred'), T = sumStats(R, I);
  const date = new Date().toLocaleDateString('sv-SE', {day: 'numeric', month: 'long', year: 'numeric'});
  if (!S.rooms.length) return '<div class="card empty"><p>Lägg in rum och saker först, så kan ni ta ut en rapport här.</p></div>';
  // per rum
  const rs = rooms().map((r, idx) => ({r, idx, R: stats('reno', r.id), I: stats('inred', r.id)})).map(o => ({...o, T: sumStats(o.R, o.I)}));
  const dc = v => `<span class="${v < 0 ? 'bad' : 'good'}">${v < 0 ? '−' : '+'}${kr(Math.abs(v))}</span>`;
  const tbl = `<table><thead><tr><th>Rum</th><th>Reno budget</th><th>Reno prognos</th><th>Avvikelse</th><th>Inred budget</th><th>Inred prognos</th><th>Avvikelse</th><th>Klart</th></tr></thead><tbody>
  ${rs.map(o => `<tr><td>${esc(o.r.emoji || '')} ${esc(o.r.name)}</td><td>${kr(o.R.budget)}</td><td>${kr(o.R.fc)}</td><td>${o.R.budget || o.R.fc ? dc(o.R.budget - o.R.fc) : ''}</td><td>${kr(o.I.budget)}</td><td>${kr(o.I.fc)}</td><td>${o.I.budget || o.I.fc ? dc(o.I.budget - o.I.fc) : ''}</td><td>${o.T.done}/${o.T.n}</td></tr>`).join('')}</tbody>
  <tfoot><tr><td>Totalt</td><td>${kr(R.budget)}</td><td>${kr(R.fc)}</td><td>${dc(R.budget - R.fc)}</td><td>${kr(I.budget)}</td><td>${kr(I.fc)}</td><td>${dc(I.budget - I.fc)}</td><td>${T.done}/${T.n}</td></tr></tfoot></table>`;
  // donut per rum
  const parts = rs.filter(o => o.T.fc > 0);
  const tot = parts.reduce((s, o) => s + o.T.fc, 0);
  const rad = 70, circ = 2 * Math.PI * rad;
  let off = 0;
  const segs = parts.map(o => {
    const len = o.T.fc / tot * circ, seg = `<circle cx="100" cy="100" r="${rad}" fill="none" stroke="${roomColor(o.idx)}" stroke-width="28" stroke-dasharray="${Math.max(0, len - 2)} ${circ}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(o.r.name)}: ${kr(o.T.fc)}</title></circle>`;
    off += len; return seg;
  }).join('');
  const donut = tot ? `<div class="row wrapx" style="gap:22px;align-items:flex-start"><svg viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Kostnad per rum">${segs}
    <text x="100" y="97" text-anchor="middle" font-size="12" fill="#6b7670">Totalt</text><text x="100" y="117" text-anchor="middle" font-size="16" font-weight="700" fill="#26312d">${kr(tot)}</text></svg>
    <div class="legendlist" style="flex:1;min-width:220px">${parts.sort((a, b) => b.T.fc - a.T.fc).map(o => `<div><i style="background:${roomColor(o.idx)}"></i>${esc(o.r.name)}<b>${kr(o.T.fc)} · ${pct(o.T.fc, tot)}%</b></div>`).join('')}</div></div>` : '<p class="sub">Inga kostnader inlagda ännu.</p>';
  // per typ
  const byType = {};
  S.items.forEach(i => { const k = i.type || 'Övrigt'; byType[k] = (byType[k] || 0) + fcOf(i); });
  const types = Object.entries(byType).filter(e => e[1] > 0).sort((a, b) => b[1] - a[1]);
  const maxT = types.length ? types[0][1] : 1;
  const typeBars = types.map(([k, v]) => `<div class="hbar"><span>${esc(k)}</span><div class="bar"><i style="width:${v / maxT * 100}%"></i></div><b style="text-align:right">${kr(v)}</b></div>`).join('') || '<p class="sub">–</p>';
  // listor
  const open = S.items.filter(i => !i.done).sort((a, b) => (a.start || '9') < (b.start || '9') ? -1 : 1);
  const doneL = S.items.filter(i => i.done);
  const li = i => `<li><b>${esc(i.title)}</b> – ${esc(roomById(i.room)?.name || '')} – ${kr(fcOf(i))}${i.kind === 'inred' ? ' (inredning)' : ''}</li>`;
  const over = rs.filter(o => (o.R.budget && o.R.fc > o.R.budget) || (o.I.budget && o.I.fc > o.I.budget));
  const late = S.items.filter(i => i.kind === 'reno' && !i.done && i.end && pd(i.end) < TODAY);
  const watch = (over.length || late.length) ? `<div class="card" style="border-color:var(--red);margin-bottom:12px"><b class="bad">Att hålla ögonen på</b><ul>
    ${over.map(o => `<li>${esc(o.r.name)} ligger över budget${o.R.budget && o.R.fc > o.R.budget ? ` på renovering (${kr(o.R.fc - o.R.budget)} över)` : ''}${o.I.budget && o.I.fc > o.I.budget ? ` på inredning (${kr(o.I.fc - o.I.budget)} över)` : ''}</li>`).join('')}
    ${late.map(i => `<li>Försenat: ${esc(i.title)} (skulle vara klart ${fmtD(pd(i.end))})</li>`).join('')}</ul></div>` : '';
  const d = T.budget - T.fc;
  return `<div class="rep"><div class="row spread wrapx noprint"><h2 style="margin:0">Rapport</h2><div class="row"><button class="btn ghost" data-act="csv">⬇ Excel (CSV)</button><button class="btn" data-act="print">🖨 Skriv ut / spara PDF</button></div></div>
  <h1 style="margin:18px 0 2px">${esc(S.settings.title || 'Villa Solviken')}</h1><div class="sub" style="margin-top:0">Statusrapport ${date}</div>
  <div class="grid g4" style="margin-bottom:12px">
    <div class="card stat"><div class="lbl">Budget</div><div class="val">${kr(T.budget)}</div></div>
    <div class="card stat"><div class="lbl">Prognos</div><div class="val">${kr(T.fc)}</div><div class="note ${T.budget && d < 0 ? 'bad' : 'good'}"><b>${diffTxt(T.budget, T.fc)}</b></div></div>
    <div class="card stat"><div class="lbl">Betalt hittills</div><div class="val">${kr(T.actual)}</div></div>
    <div class="card stat"><div class="lbl">Klart</div><div class="val">${T.done} av ${T.n}</div><div class="note">${pct(T.done, T.n)}%</div></div></div>
  ${watch}
  <h2>Vart går pengarna?</h2><div class="grid g2"><div class="card"><b>Per rum</b><div style="margin-top:10px">${donut}</div></div><div class="card"><b>Per typ av kostnad</b><div style="margin-top:10px">${typeBars}</div></div></div>
  <h2>Budget mot prognos per rum</h2><div class="card scrollx">${tbl}</div>
  <p class="sub" style="margin-top:8px">Prognos = faktisk kostnad där den är inlagd, annars uppskattad kostnad. Avvikelse: grönt = under budget, rött = över.</p>
  <h2>Kvar att göra (${open.length})</h2><div class="card">${open.length ? `<ul>${open.map(li).join('')}</ul>` : 'Allt är klart! 🎉'}</div>
  <h2>Klart (${doneL.length})</h2><div class="card">${doneL.length ? `<ul>${doneL.map(li).join('')}</ul>` : 'Inget avbockat ännu.'}</div></div>`;
}

/* ---------- Formulär ---------- */
const modal = $('#modal');
function openModal(html) { modal.innerHTML = `<div class="sheet">${html}</div>`; modal.classList.add('open'); }
function closeModal() { modal.classList.remove('open'); modal.innerHTML = ''; }
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

const opts = (name, list, val) => `<div class="opts">${list.map(o => `<label><input type="radio" name="${name}" value="${esc(o)}" ${o === val ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('')}</div>`;

  const isReno = kind === 'reno';

  openModal(`<h2>${id ? 'Ändra' : 'Ny'} ${isReno ? 'renoveringssak' : 'inredningssak'}</h2>
  <form id="itemform" data-kind="${kind}" data-id="${id || ''}">

  <div class="f"><label>${isReno ? 'Vad ska göras?' : 'Vad ska köpas?'}</label><input type="text" name="title" value="${esc(it.title || '')}" placeholder="${isReno ? 't.ex. Lägga nytt golv' : 't.ex. Soffa'}"></div>
  <div class="f"><label>${isReno ? 'Vem gör det / vad är det?' : 'Typ'}</label>${opts('type', isReno ? RENO_TYPES : INRED_TYPES, it.type)}</div>
  ${isReno ? `<div class="f" id="matbox"><label>Välj från prislistan (material eller timarvode)</label><select name="priceId"><option value="">– Skriv in en summa själv –</option>${S.prices.map(p => `<option value="${p.id}" ${p.id === it.priceId ? 'selected' : ''}>${esc(p.name)} (${krP(num(p.price))}/${esc(p.unit)})</option>`).join('')}</select>
     <div id="qtybox" style="margin-top:8px"><label>Antal (st, meter eller timmar)</label><input type="text" inputmode="decimal" autocomplete="off" name="qty" value="${esc(it.qty ?? '')}"><div id="calc" class="calc" style="margin-top:8px"></div></div></div>` : ''}
  <div class="f" id="estbox"><label>Uppskattad kostnad (kr)</label><input type="text" inputmode="decimal" autocomplete="off" name="est" value="${it.priceId ? '' : esc(it.est ?? '')}" placeholder="0"><div class="hint">Det ni tror att det kommer kosta, inklusive moms.</div></div>
  <div class="f"><label>Faktisk kostnad (kr)</label><input type="text" inputmode="decimal" autocomplete="off" name="actual" value="${hasActual(it) ? esc(it.actual) : ''}" placeholder="Fyll i när det är betalt"><div class="hint">Lämna tomt tills ni vet vad det blev.</div></div>
  ${isReno ? `<div class="f"><label>Ansvarig / hantverkare</label><input type="text" name="who" value="${esc(it.who || '')}" placeholder="t.ex. Elektriker Nilsson, eller Magnus"></div>
  <div class="f"><label>Tidsperiod</label><input type="hidden" name="start" value=""><input type="hidden" name="end" value=""><div id="cal" class="cal"></div></div>
  <div class="f"><label>Måste något annat vara klart innan den här kan starta?</label><select name="dep"><option value="">– Nej, inget –</option>${others.map(o => `<option value="${o.id}" ${o.id === it.dep ? 'selected' : ''}>${esc(roomById(o.room)?.name || '')}: ${esc(o.title)}</option>`).join('')}</select><div class="hint">${others.length ? 'Välj den sak som måste bli klar först, till exempel &quot;Riva golv&quot; före &quot;Lägga nytt golv&quot;. Tidsplanen varnar om ni planerar start för tidigt.' : 'Här dyker andra renoveringssaker upp så fort ni har lagt in fler. Lägg först in den andra saken, och kom sedan tillbaka hit och välj den.'}</div></div>`
  : `<div class="f"><label>Butik eller länk</label><input type="text" name="store" value="${esc(it.store || '')}" placeholder="t.ex. IKEA, Mio, Blocket"></div>
  <div class="f"><label>Hur viktigt?</label>${opts('prio', ['Måste', 'Bra att ha', 'Kanske'], it.prio || 'Bra att ha')}</div>`}
  <div class="f"><label>Anteckning</label><textarea name="note" rows="2">${esc(it.note || '')}</textarea></div>
  <label class="donecheck"><input type="checkbox" name="done" ${it.done ? 'checked' : ''}> ${isReno ? 'Klart!' : 'Köpt!'}</label>
  <div id="formerr" class="bad" style="margin-top:6px;font-weight:600"></div><div class="btns"><button class="btn" type="button" data-act="submitForm">Spara</button><button class="btn ghost" type="button" data-act="closeModal">Avbryt</button>${id ? '<button class="btn danger" type="button" data-act="delItem" data-id="' + id + '">Ta bort</button>' : ''}</div></form>`);
  if (isReno) { refreshItemForm(); const f = $('#itemform'); f.addEventListener('input', refreshItemForm); calInit(it); calRender(); }
}
/* ---------- Periodkalender ---------- */
const CAL = {s: null, e: null, v: 0};
const isoD = ms => new Date(ms).toISOString().slice(0, 10);
function calInit(it) {
  CAL.s = it.start ? pd(it.start) : null; CAL.e = it.end ? pd(it.end) : (CAL.s || null);
  const d = new Date(CAL.s || TODAY); CAL.v = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
}
function calRender() {
  const box = $('#cal'); if (!box) return;
  const v = new Date(CAL.v), y = v.getUTCFullYear(), m = v.getUTCMonth();
  const lead = (new Date(Date.UTC(y, m, 1)).getUTCDay() + 6) % 7, days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  let cells = '<i></i>'.repeat(lead);
  for (let d = 1; d <= days; d++) {
    const ms = Date.UTC(y, m, d), c = [];
    if (ms === TODAY) c.push('today');
    if (ms === CAL.s) c.push('st'); if (ms === CAL.e) c.push('en');
    if (CAL.s && CAL.e && ms > CAL.s && ms < CAL.e) c.push('mid');
    cells += `<button type="button" class="cd ${c.join(' ')}" data-act="calDay" data-v="${ms}">${d}</button>`;
  }
  const label = v.toLocaleDateString('sv-SE', {month: 'long', year: 'numeric', timeZone: 'UTC'});
  const sum = !CAL.s ? '<span class="hint">Tryck på första dagen</span>'
    : CAL.s === CAL.e ? `${fmtD(CAL.s)} <span class="hint">(en dag)</span>`
    : !CAL.e ? `Start ${fmtD(CAL.s)} <span class="hint">– tryck på sista dagen</span>`
    : `${fmtD(CAL.s)} – ${fmtD(CAL.e)} <span class="hint">(${(CAL.e - CAL.s) / DAY + 1} dagar)</span>`;
  box.innerHTML = `<div class="ch"><button type="button" data-act="calPrev" aria-label="Föregående månad">‹</button><b>${label}</b><button type="button" data-act="calNext" aria-label="Nästa månad">›</button></div>
  <div class="g7">${['Mån', 'Tis', 'Ons', 'Tor', 'Fre', 'Lör', 'Sön'].map(w => `<div class="wd">${w}</div>`).join('')}${cells}</div>
  <div class="sum"><span>${sum}</span>${CAL.s ? '<button type="button" class="btn ghost small" data-act="calClear">Rensa</button>' : ''}</div>`;
  const f = $('#itemform'); if (f) { f.elements.start.value = CAL.s ? isoD(CAL.s) : ''; f.elements.end.value = CAL.s ? isoD(CAL.e || CAL.s) : ''; }
}
function calPick(ms) {
  if (!CAL.s || CAL.e) { CAL.s = ms; CAL.e = null; CAL.picked = false; }      // första trycket: ny period
  else if (ms < CAL.s) { CAL.e = CAL.s; CAL.s = ms; CAL.picked = true; }      // andra trycket före start: byt plats
  else { CAL.e = ms; CAL.picked = true; }                                      // andra trycket: sista dagen
  calRender();
}
function calMonth(delta) { const d = new Date(CAL.v); CAL.v = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + delta, 1); calRender(); }

function refreshItemForm() {
  const f = $('#itemform'); if (!f || f.dataset.kind !== 'reno') return;
  const type = f.elements.type.value, mat = type === 'Material' || type === 'Hantverkare';
  $('#matbox').style.display = mat ? '' : 'none';
  const pid = mat ? f.elements.priceId.value : '';
  $('#qtybox').style.display = pid ? '' : 'none';
  $('#estbox').style.display = pid ? 'none' : '';
  const p = priceOf(pid);
  $('#calc').textContent = p && !num(p.price) ? 'Priset är inte satt än. Fyll i det i prislistan, så räknas kostnaden ut automatiskt.' : p ? `${f.elements.qty.value || 0} ${p.unit} × ${krP(num(p.price))} = ${kr(num(p.price) * num(f.elements.qty.value))}` : '';
}
async function submitItem(f) {
  const d = new FormData(f), kind = f.dataset.kind, id = f.dataset.id || null;
  const isReno = kind === 'reno';
  const useP = isReno && (d.get('type') === 'Material' || d.get('type') === 'Hantverkare') && d.get('priceId');
  const actualRaw = String(d.get('actual') || '').trim();
  const data = {kind, room: d.get('room'), title: String(d.get('title')).trim(), type: d.get('type'),
    priceId: useP ? d.get('priceId') : '', qty: useP ? num(d.get('qty')) : null, est: useP ? 0 : num(d.get('est')),
    actual: actualRaw === '' ? null : num(actualRaw), done: d.get('done') === 'on', note: String(d.get('note') || '').trim()};
  if (isReno) Object.assign(data, {who: String(d.get('who') || '').trim(), start: d.get('start') || '', end: d.get('end') || '', dep: d.get('dep') || ''});
  else Object.assign(data, {store: String(d.get('store') || '').trim(), prio: d.get('prio') || 'Bra att ha'});
  if (!id) data.created = Date.now();
  if (!data.title) return;
  if (isReno) {
    if (data.start && !data.end) data.end = data.start;
    if (data.end && !data.start) data.start = data.end;
    if (data.start && data.end && pd(data.end) < pd(data.start)) { $('#formerr').textContent = 'Slutdatumet ligger före startdatumet. Rätta datumen så sparas det.'; return; }
  }
  try { await Store.save('items', id, data); closeModal(); toast('Sparat ✓'); }
  catch (err) { $('#formerr').textContent = 'Det gick inte att spara: ' + errText(err); }
}

function roomForm(id) {
  const r = id ? roomById(id) : {name: '', emoji: '🏠', budgetReno: '', budgetInred: ''};
  openModal(`<h2>${id ? 'Ändra rum' : 'Nytt rum'}</h2><form id="roomform" data-id="${id || ''}">
  <div class="f"><label>Namn</label><input type="text" name="name" value="${esc(r.name)}"></div>
  <div class="f"><label>Budget renovering (kr)</label><input type="text" inputmode="decimal" autocomplete="off" name="budgetReno" value="${esc(r.budgetReno ?? '')}" placeholder="0"><div class="hint">Material, hantverkare och annat som ska göras i rummet.</div></div>
  <div class="f"><label>Budget inredning (kr)</label><input type="text" inputmode="decimal" autocomplete="off" name="budgetInred" value="${esc(r.budgetInred ?? '')}" placeholder="0"><div class="hint">Möbler, lampor, textilier med mera.</div></div>
  <div id="formerr" class="bad" style="margin-top:6px;font-weight:600"></div><div class="btns"><button class="btn" type="button" data-act="submitForm">Spara</button><button class="btn ghost" type="button" data-act="closeModal">Avbryt</button>${id ? '<button class="btn danger" type="button" data-act="delRoom" data-id="' + id + '">Ta bort rum</button>' : ''}</div></form>`);
}
function priceForm(id, hour) {
  const p = id ? priceOf(id) : hour ? {name: '', unit: 'timme', price: '', source: ''} : {name: '', unit: 'st', price: '', source: ''};
  openModal(`<h2>${id ? 'Ändra artikel' : hour ? 'Ny hantverkare' : 'Ny artikel'}</h2><form id="priceform" data-id="${id || ''}">
  <div class="f"><label>Artikel</label><input type="text" name="name" value="${esc(p.name)}" placeholder="${hour ? 't.ex. Målare – timarvode' : 't.ex. Gipsskiva 13 mm 900×2400'}"></div>
  <div class="f2"><div class="f"><label>Enhet</label><select name="unit">${UNITS.map(u => `<option ${u === p.unit ? 'selected' : ''}>${u}</option>`).join('')}</select></div>
  <div class="f"><label>Pris per enhet (kr, inkl. moms)</label><input type="text" inputmode="decimal" autocomplete="off" name="price" value="${esc(p.price)}" placeholder="${hour ? 'Lämna tomt om ni inte vet än' : ''}" ><div class="hint">${hour || p.unit === 'timme' ? 'Timarvode inklusive moms (pris exkl. moms × 1,25). Kan fyllas i senare.' : ''}</div></div></div>
  <div class="f"><label>Källa</label><input type="text" name="source" value="${esc(p.source || '')}" placeholder="t.ex. Anders Trä, faktura 2026-10-12"></div>
  <div id="formerr" class="bad" style="margin-top:6px;font-weight:600"></div><div class="btns"><button class="btn" type="button" data-act="submitForm">Spara</button><button class="btn ghost" type="button" data-act="closeModal">Avbryt</button>${id ? '<button class="btn danger" type="button" data-act="delPrice" data-id="' + id + '">Ta bort</button>' : ''}</div></form>`);
}

/* ---------- CSV ---------- */
function csv() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const head = ['Rum', 'Lista', 'Typ', 'Vad', 'Uppskattat (kr)', 'Faktiskt (kr)', 'Prognos (kr)', 'Klart', 'Start', 'Slut', 'Ansvarig', 'Butik'];
  const rows = S.items.map(i => [roomById(i.room)?.name, i.kind === 'reno' ? 'Renovering' : 'Inredning', i.type, i.title, estOf(i), hasActual(i) ? i.actual : '', fcOf(i), i.done ? 'Ja' : 'Nej', i.start, i.end, i.who, i.store]);
  const text = '﻿' + [head, ...rows].map(r => r.map(q).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: 'text/csv;charset=utf-8'}));
  a.download = 'renovering-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
}

/* ---------- Händelser ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if (a === 'toggle') { e.stopPropagation(); const it = S.items.find(x => x.id === id); if (it) await Store.save('items', id, {done: !it.done}); return; }
  switch (a) {
    case 'tab': S.tab = v; render(); window.scrollTo(0, 0); break;
    case 'filter': S.filter = v; render(); break;
    case 'collapse': S.collapsed[v] = !S.collapsed[v]; render(); break;
    case 'new': if (!S.rooms.length) { S.tab = 'oversikt'; render(); break; } itemForm(el.dataset.kind, null, el.dataset.room); break;
    case 'edit': { const it = S.items.find(x => x.id === id); if (it) itemForm(it.kind, id); break; }
    case 'roomNew': roomForm(); break;
    case 'roomEdit': roomForm(id); break;
    case 'priceNew': priceForm(); break;
    case 'priceNewHour': priceForm(null, true); break;
    case 'priceEdit': priceForm(id); break;
    case 'closeModal': closeModal(); break;
    case 'calDay': calPick(Number(v)); break;
    case 'calPrev': calMonth(-1); break;
    case 'calNext': calMonth(1); break;
    case 'calClear': CAL.s = CAL.e = null; CAL.picked = false; calRender(); break;
    case 'submitForm': handleForm(el.closest('form')); break;
    case 'seedRooms': {
      const base = Date.now();
      for (let i = 0; i < DEFAULT_ROOMS.length; i++) await Store.save('rooms', null, {name: DEFAULT_ROOMS[i][0], emoji: DEFAULT_ROOMS[i][1], budgetReno: 0, budgetInred: 0, order: base + i});
      break;
    }
    case 'seedPrices': for (const p of SEED_PRICES) if (!S.prices.some(x => x.name === p.name)) await Store.save('prices', null, p); break;
    case 'delItem': if (confirm('Ta bort den här posten?')) { closeModal(); await Store.del('items', id); } break;
    case 'delPrice': if (confirm('Ta bort artikeln? Poster som använder den behåller inte priset.')) { closeModal(); await Store.del('prices', id); } break;
    case 'delRoom': {
      const n = S.items.filter(i => i.room === id).length;
      if (confirm(n ? `Rummet har ${n} poster som också tas bort. Fortsätta?` : 'Ta bort rummet?')) {
        closeModal(); for (const i of S.items.filter(i => i.room === id)) await Store.del('items', i.id); await Store.del('rooms', id);
      } break;
    }
    case 'print': window.print(); break;
    case 'csv': csv(); break;
    case 'saveTitle': await Store.save('settings', 'main', {title: $('#s_title').value.trim()}); break;
    case 'logout': Store.signOut(); break;
  }
});
async function handleForm(f) {
  const err = m => { const e = $('#formerr'); if (e) e.textContent = m; };
  try {
    if (f.id === 'itemform') {
      if (!f.elements.title.value.trim()) return err('Skriv vad som ska göras eller köpas.');
      if (!f.elements.room.value) return err('Välj ett rum.');
      return await submitItem(f);
    }
    if (f.id === 'roomform') {
      const d = new FormData(f), id = f.dataset.id || null, name = String(d.get('name')).trim();
      if (!name) return err('Skriv ett namn på rummet.');
      const data = {name, budgetReno: num(d.get('budgetReno')), budgetInred: num(d.get('budgetInred'))};
      if (!id) { data.emoji = '🏠'; data.order = Date.now(); }
      await Store.save('rooms', id, data); closeModal(); toast('Sparat ✓'); return;
    }
    if (f.id === 'priceform') {
      const d = new FormData(f), id = f.dataset.id || null, name = String(d.get('name')).trim();
      if (!name) return err('Skriv ett namn på artikeln.');
      if (!String(d.get('price')).trim() && d.get('unit') !== 'timme') return err('Skriv ett pris per enhet.');
      await Store.save('prices', id, {name, unit: d.get('unit'), price: num(d.get('price')), source: String(d.get('source') || '').trim()});
      closeModal(); toast('Sparat ✓'); return;
    }
    if (f.id === 'login') {
      try { await Store.signIn($('#pw').value); } catch (e) { $('#loginerr').textContent = 'Fel lösenord, försök igen.'; }
    }
  } catch (e) { err('Det gick inte att spara: ' + errText(e)); }
}
document.addEventListener('submit', e => { e.preventDefault(); handleForm(e.target); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input:not([type=checkbox]):not([type=radio])') && e.target.form) { e.preventDefault(); handleForm(e.target.form); }
});

/* ---------- Start ---------- */
(async function start() {
  if (FIREBASE_CONFIG) {
    try { await initShared(); return; }
    catch (err) { console.error(err); S.mode = 'local'; S.status = 'Kunde inte ansluta till Firebase'; }
  }
  Store.loadLocal(); S.loading = false; render();
})();
</script>
</body>
</html>
